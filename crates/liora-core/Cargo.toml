[package]
name = "liora-core"
version = "0.6.1"
edition = "2024"
description = "Core Liora app configuration, theme initialization, portals, and shared native GPUI helpers."
license-file = "../../LICENSE.md"
repository = "https://github.com/yhyzgn/liora"
readme = "README.md"
publish = true

[dependencies]
gpui.workspace = true
liora-theme = { version = "0.6.1", path = "../liora-theme" }
toml.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[build-dependencies]
toml.workspace = true
